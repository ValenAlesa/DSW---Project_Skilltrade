<div class="admin-dashboard-container">
  <!-- Hero Header -->
  <div class="hero-header">
    <button class="btn-volver" (click)="volver()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Volver
    </button>

    <h1 class="main-title">
      <svg class="title-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z" />
        <path d="M2 17l10 5 10-5" />
        <path d="M2 12l10 5 10-5" />
      </svg>
      Panel de Administración
    </h1>
    <p class="subtitle">Bienvenido, {{ adminName }}</p>
  </div>

  <!-- Admin Grid -->
  <div class="admin-grid">
    <!-- Card: Gestionar Usuarios -->
    <div class="admin-card" (click)="navegarAUsuarios()">
      <div class="card-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </div>
      <h3 class="card-title">Gestionar Administradores</h3>
      <p class="card-description">Crear nuevos administradores del sistema</p>
      <div class="card-arrow">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </div>
    </div>

    <!-- Card: Gestionar Servicios -->
    <div class="admin-card" (click)="navegarAServicios()">
      <div class="card-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
      </div>
      <h3 class="card-title">Gestionar Servicios</h3>
      <p class="card-description">Crear nuevos servicios para publicaciones</p>
      <div class="card-arrow">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </div>
    </div>
  </div>
</div>
