<div class="login-container">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Ingrese su correo" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="Ingrese su contraseña" />
      </div>

      <button type="submit" [disabled]="!loginForm.valid">Ingresar</button>

      <p class="error" *ngIf="loginError">{{ loginError }}</p>
    </form>

      <!-- Link to registration page -->
      <div class="text-center mt-3">
        <p>
          ¿No tenés cuenta?
          <a [routerLink]="['/register']" class="register-link">Registrate</a>
        </p>
      </div>

  </div>
</div>
